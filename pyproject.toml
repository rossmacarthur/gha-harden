[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["gha_harden"]

[project]
name = "gha-harden"
version = "0.0.0"
description = "Harden GitHub Action workflows by pinning versions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ross MacArthur", email = "ross@macarthur.io" }
]
requires-python = ">=3.12"
dependencies = []
